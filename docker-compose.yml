services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trace_india
    ports:
      - "5432:5432"
    networks:
      - triage_net
    # Optional: persist data
    # volumes:
    #   - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - triage_net
    # Using host DNS (Google) to avoid DNS resolution issues inside containers
    dns:
      - 8.8.8.8
    # If you need the container to use the host network for outbound internet access,
    # uncomment the line below. Note: on Windows Docker Desktop this may not be supported.
    # network_mode: "host"
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - triage_net
    dns:
      - 8.8.8.8

networks:
  triage_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.65.0/24

# Uncomment to persist DB data
#volumes:
#  db_data:
